[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-framework"
version = "0.1.0"
description = "Full-featured agentic AI framework: multi-provider LLMs, tool calling, shell/FS, browser, computer-use, MCP, memory, and agent loops"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Agentic Framework" }]
keywords = ["ai", "agents", "llm", "mcp", "tool-calling", "browser", "computer-use"]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "litellm>=1.40",
    "playwright>=1.40",
    "mcp>=1.0",
    "rich>=13.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "aiofiles>=23.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
browser = ["browser-use>=0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
all = ["agentic-framework[browser,dev]"]

[project.scripts]
agentic = "agentic.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[tool.ruff]
line-length = 100
target-version = "py310"
